# Drop-in for docker.service: give Docker up to 300 s to stop (default 90 s).
# Normally swg-stack.service has already stopped the SWG containers, so Docker
# stops quickly. This is the safety net if that unit is missing or failed.
# Install as /etc/systemd/system/docker.service.d/override.conf (see README.md).
[Service]
TimeoutStopSec=300
